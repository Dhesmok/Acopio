<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self'; font-src 'self'; object-src 'none';">
  <title>Acopio · mapa de lotes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    // La app se guarda en el celular para abrir sin señal. Eso significa
    // que una versión nueva NO entra sola: el service worker la deja lista
    // en la caché, pero la pantalla que está abierta sigue corriendo la
    // vieja hasta que se recargue. Aquí se detecta y se le avisa a la app,
    // que ofrece el recargue en vez de hacerlo sola: alguien puede estar
    // a mitad de registrar un lote.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        // si no había ninguna corriendo, este es el primer arranque y el
        // cambio de control no es una actualización
        const habia = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (habia) document.dispatchEvent(new Event('acopio:version-nueva'));
        });
        const reg = await navigator.serviceWorker.register('sw.js');
        // El celular se queda con la app abierta todo el turno, y el
        // navegador solo busca versiones nuevas al navegar. Sin esto, un
        // arreglo publicado a media mañana no llegaba hasta el día
        // siguiente.
        setInterval(() => reg.update(), 30 * 60 * 1000);
      });
    }
  </script>
</body>
</html>
