name: Comprobaciones

on: [push, pull_request]

jobs:
  probar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correr pruebas
        env:
          ACOPIO_PG: postgresql://postgres:postgres@localhost:5432/postgres
        run: cd acopio && node pruebas/correr.mjs
